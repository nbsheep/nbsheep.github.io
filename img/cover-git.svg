<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#123b2a"/>
      <stop offset="100%" stop-color="#1f6f5f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#g)"/>
  <circle cx="660" cy="70" r="130" fill="rgba(64,232,160,0.08)"/>
  <circle cx="140" cy="340" r="100" fill="rgba(64,232,160,0.06)"/>
  <!-- commit 节点 + 分支线，模拟 git 历史图 -->
  <g stroke="rgba(64,232,160,0.7)" stroke-width="3" fill="none">
    <line x1="300" y1="150" x2="360" y2="150"/>
    <line x1="360" y1="150" x2="420" y2="150"/>
    <line x1="420" y1="150" x2="480" y2="150"/>
    <line x1="420" y1="150" x2="420" y2="240"/>
    <line x1="420" y1="240" x2="480" y2="240"/>
  </g>
  <g fill="rgba(64,232,160,0.9)">
    <circle cx="300" cy="150" r="9"/>
    <circle cx="360" cy="150" r="9"/>
    <circle cx="420" cy="150" r="9"/>
    <circle cx="480" cy="150" r="9"/>
    <circle cx="420" cy="240" r="9"/>
    <circle cx="480" cy="240" r="9"/>
  </g>
  <text x="400" y="310" font-size="42" fill="rgba(64,232,160,0.92)" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="bold">Git · 版本控制</text>
</svg>
